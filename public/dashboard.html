<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memnon</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f8f7f4" />
  <style>
    .note-item {
      border: 1px solid #e8e6e0; border-radius: 8px; padding: 14px 16px;
      margin-bottom: 12px; background: #fff;
    }
    .note-item:last-child { margin-bottom: 0; }
    .note-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
    .note-date  { font-size: 0.75rem; color: #888; margin-bottom: 8px; }
    .note-summary { font-size: 0.82rem; color: #555; line-height: 1.6; margin-bottom: 10px; }
    .influenced-by { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0eeec; }
    .influenced-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em;
                        text-transform: uppercase; color: #888; margin-bottom: 8px; }
    .influenced-item {
      display: flex; flex-direction: column; gap: 2px;
      background: #fafafa; border: 1px solid #ebebeb; border-radius: 6px;
      padding: 8px 12px; margin-bottom: 6px; font-size: 0.8rem;
    }
    .influenced-item:last-child { margin-bottom: 0; }
    .influenced-source { font-weight: 600; color: #333; }
    .influenced-excerpt { font-style: italic; color: #666; font-size: 0.77rem; margin-top: 2px; }
    .influenced-because { color: #2563eb; font-size: 0.77rem; margin-top: 2px; }
  </style>
</head>
<body>
  <nav>
    <span class="nav-brand"><img class="brand-mark" src="/nav-logo.png" alt="" /> Memnon</span>
    <div class="nav-right">
      <span id="nav-name" class="muted"></span>
      <button id="signout-btn" class="btn btn-outline" style="padding:6px 14px; font-size:0.8rem;">
        Sign out
      </button>
    </div>
  </nav>

  <div class="container">

    <div id="upload-status" style="display:none; margin-bottom:16px; padding:10px 14px; border-radius:8px; background:#eff6ff; color:#1d4ed8; font-size:0.875rem;"></div>

    <div style="margin-bottom:28px; display:flex; align-items:center; justify-content:space-between; gap:16px;">
      <div>
        <h1>Welcome back, <span id="first-name"></span> 👋</h1>
      </div>
      <img src="/active-scema-logo-transparent-bg.png" alt="Active Schema" style="height:72px; width:auto; flex-shrink:0;" />
    </div>

    <!-- Lane -->
    <div class="card" style="position:relative; overflow:hidden;">
      <img src="/artifacts.png" alt="" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 60%; opacity:0.08; pointer-events:none;" />
      <div style="position:relative; display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h2 id="lane-title">Loading…</h2>
          <p id="lane-desc" style="color:#555;"></p>
          <p style="margin-top:8px;">
            <span class="tag" id="lane-detail"></span>
          </p>
        </div>
        <a href="/setup" class="btn btn-outline" style="padding:7px 14px; font-size:0.8rem; white-space:nowrap;">
          Change lane
        </a>
      </div>
    </div>

    <!-- Drive folders -->
    <div class="card" style="position:relative; overflow:hidden;">
      <img src="/sun_and_waves.png" alt="" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.08; pointer-events:none;" />
      <div style="position:relative;">
      <h2>Your recordings</h2>
      <p style="color:#555; margin-bottom:20px;">
        Record here or share from Voice Memos. Notes are saved to your
        <strong>memnon-notes</strong> folder in Google Drive within ~60 seconds.
      </p>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div style="position:relative; overflow:hidden; border:1px solid #e8e6e0; border-radius:10px; padding:16px;">
          <img src="/explorers_journal.png" alt="" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.10; pointer-events:none;" />
          <div style="position:relative;">
            <div style="margin-bottom:8px;"><img class="inline-mark" src="/nav-logo.png" alt="" style="width:1.6rem; height:1.6rem;" /></div>
            <div style="font-weight:600; margin-bottom:4px;">Record here</div>
            <div style="font-size:0.8rem; color:#888; margin-bottom:12px;">Processed instantly</div>
            <button id="record-btn" class="btn btn-primary" style="width:100%; justify-content:center; font-size:0.85rem; padding:8px 12px;">
              <img class="inline-mark" src="/nav-logo.png" alt="" />
              Record voice memo
            </button>
          </div>
        </div>
        <div style="position:relative; overflow:hidden; border:1px solid #e8e6e0; border-radius:10px; padding:16px;">
          <img src="/sound_waves.png" alt="" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.10; pointer-events:none;" />
          <div style="position:relative;">
            <div style="font-size:1.4rem; margin-bottom:8px;">📝</div>
            <div style="font-weight:600; margin-bottom:4px;">memnon-notes</div>
            <div style="font-size:0.8rem; color:#888; margin-bottom:12px;">Your processed notes</div>
            <a id="notes-link" href="#" target="_blank"
               class="btn btn-primary" style="padding:7px 12px; font-size:0.8rem;">
              Open in Drive ↗
            </a>
          </div>
        </div>
      </div>
      </div>
    </div>

    <!-- Recent Notes -->
    <div class="card" id="recent-notes-card" style="display:none;">
      <h2>Recent notes</h2>
      <div id="recent-notes-list" style="margin-top:14px;"></div>
    </div>

    <!-- iPhone share target instructions — commented out until iOS PWA share target is reliable
    <div class="card">
      <h2>📱 Capture from iPhone</h2>
      <div id="share-status" style="display:none; margin-bottom:16px; padding:10px 14px; border-radius:8px; background:#eff6ff; color:#1d4ed8; font-size:0.875rem;"></div>
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-body">
          <div class="step-title">Record in Voice Memos</div>
          <div class="step-desc">Screen can lock. Action button works as normal.</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-body">
          <div class="step-title">Add Memnon to your home screen</div>
          <div class="step-desc">
            In Safari tap Share → <strong>Add to Home Screen</strong>. Only needed once.
          </div>
        </div>
      </div>
      <div class="step" style="margin-bottom:0;">
        <div class="step-num">3</div>
        <div class="step-body">
          <div class="step-title">Share directly to Memnon</div>
          <div class="step-desc">
            Tap the recording → share icon → <strong>Memnon</strong>.
            Your note is processed automatically — no Drive navigation needed.
          </div>
        </div>
      </div>
    </div>
    -->

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAfnbEJrqWZPgxh_k61dl2D-DAEO4AbMoY",
      authDomain: "memnon-app.web.app",
      projectId: "memnon-app",
      storageBucket: "memnon-app.firebasestorage.app",
      messagingSenderId: "714155490867",
      appId: "1:714155490867:web:f382fddb58a596bede6d46"
    };

    const API = "https://api-4hth6oktaa-uc.a.run.app";

    const LANE_LABELS = {
      professional: { icon: "💼", label: "Professional lane" },
      reflect:      { icon: "🌿", label: "Reflect lane" },
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db  = getFirestore(app);

    async function loadRecentNotes(uid) {
      try {
        const q = query(
          collection(db, "users", uid, "notes"),
          orderBy("date", "desc"),
          limit(5)
        );
        const snap = await getDocs(q);
        if (snap.empty) return;

        const card = document.getElementById("recent-notes-card");
        const list = document.getElementById("recent-notes-list");
        list.innerHTML = "";
        card.style.display = "block";

        snap.forEach(doc => {
          const n = doc.data();
          const div = document.createElement("div");
          div.className = "note-item";

          const influenced = (n.influenced_by || []).map(s => `
            <div class="influenced-item">
              <span class="influenced-source">${s.author || ""} — ${s.ref || ""}</span>
              ${s.excerpt ? `<span class="influenced-excerpt">"${s.excerpt}"</span>` : ""}
              ${s.because ? `<span class="influenced-because">→ ${s.because}</span>` : ""}
            </div>
          `).join("");

          div.innerHTML = `
            <div class="note-title">${n.title || "Untitled"}</div>
            <div class="note-date">${n.date || ""}</div>
            <div class="note-summary">${n.summary || ""}</div>
            ${influenced ? `
              <div class="influenced-by">
                <div class="influenced-label">Influenced by</div>
                ${influenced}
              </div>` : ""}
          `;
          list.appendChild(div);
        });
      } catch(e) {
        console.error("Could not load recent notes:", e);
      }
    }

    // ── Register service worker (PWA Share Target) ──
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(console.error);
    }

    // ── Shared auth token cache ──
    let _cachedToken = null;
    async function getToken() {
      const user = auth.currentUser;
      if (!user) return null;
      _cachedToken = await user.getIdToken();
      return _cachedToken;
    }

    // ── Upload audio to /upload endpoint ──
    async function uploadAudio(blob, filename) {
      const statusEl = document.getElementById("upload-status");
      statusEl.style.display = "block";
      statusEl.textContent = "⏳ Uploading and processing…";

      try {
        const token = await getToken();
        const form = new FormData();
        form.append("file", blob, filename);
        const res = await fetch(`${API}/upload`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: form,
        });
        if (res.ok) {
          const data = await res.json();
          statusEl.style.background = "#f0fdf4";
          statusEl.style.color = "#15803d";
          statusEl.textContent = `✅ Note saved: ${data.note}`;
        } else {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || res.statusText);
        }
      } catch (e) {
        statusEl.style.background = "#fef2f2";
        statusEl.style.color = "#dc2626";
        statusEl.textContent = `❌ Upload failed: ${e.message}`;
      }
    }

    // ── Check for file shared via Share Target (PWA) ──
    async function checkSharedFile() {
      if (!window.location.search.includes("shared=1")) return;
      history.replaceState({}, "", "/dashboard");

      const statusEl = document.getElementById("share-status");
      statusEl.style.display = "block";
      statusEl.textContent = "⏳ Processing your shared audio…";

      try {
        const file = await getSharedFileFromIDB();
        if (!file) { statusEl.textContent = "⚠️ No shared file found."; return; }
        await uploadAudio(file, file.name || "voice-memo.m4a");
        statusEl.style.background = "#f0fdf4";
        statusEl.style.color = "#15803d";
        statusEl.textContent = "✅ Your Voice Memo is being processed into a note.";
      } catch (e) {
        statusEl.style.background = "#fef2f2";
        statusEl.style.color = "#dc2626";
        statusEl.textContent = `❌ Error: ${e.message}`;
      }
    }

    function getSharedFileFromIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("active-schema", 1);
        req.onsuccess = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("shared-files")) { resolve(null); return; }
          const tx = db.transaction("shared-files", "readwrite");
          const store = tx.objectStore("shared-files");
          const all = store.getAll();
          all.onsuccess = () => {
            const records = all.result;
            if (!records.length) { resolve(null); return; }
            // Clear after reading
            store.clear();
            resolve(records[records.length - 1].file);
          };
          all.onerror = reject;
        };
        req.onerror = reject;
      });
    }

    // ── Auth state ──
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "/"; return; }

      const firstName = (user.displayName || user.email).split(" ")[0];
      document.getElementById("first-name").textContent = firstName;
      document.getElementById("nav-name").textContent = user.displayName || user.email;

      const token = await user.getIdToken();
      _cachedToken = token;

      const res = await fetch(`${API}/me`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (res.ok) {
        const data = await res.json();
        const lane = data.lane || "professional";
        const info = LANE_LABELS[lane] || LANE_LABELS.professional;

        document.getElementById("lane-title").textContent = `${info.icon} ${info.label}`;
        document.getElementById("lane-desc").textContent =
          lane === "reflect"
            ? "Personal reflections grounded in a tradition you chose."
            : "Work notes enriched with best practices for your field.";

        const detail = data.profession || data.tradition || "";
        const detailEl = document.getElementById("lane-detail");
        if (detail) {
          detailEl.textContent = detail;
        } else {
          detailEl.style.display = "none";
        }

        // inbox folder link removed — direct upload is now the primary ingest path
        if (data.notes_folder_id) {
          const notesUrl = `https://drive.google.com/drive/folders/${data.notes_folder_id}`;
          const notesEl = document.getElementById("notes-link");
          notesEl.href = notesUrl;
          notesEl.onclick = e => { e.preventDefault(); window.open(notesUrl, "_blank"); };
        }
      }

      // Load recent notes with influenced_by
      loadRecentNotes(user.uid);

      // Check for incoming shared file after auth is ready
      await checkSharedFile();

      // ── Record button ──
      let mediaRecorder, chunks = [];

      function handleRecord() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
          return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          mediaRecorder = new MediaRecorder(stream);
          chunks = [];
          mediaRecorder.ondataavailable = e => chunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, { type: "audio/webm" });
            const filename = `active-schema-${Date.now()}.webm`;
            recordBtn.innerHTML = '<img class="inline-mark" src="/nav-logo.png" alt="" /> Record voice memo';
            recordBtn.classList.remove("btn-danger");
            recordBtn.classList.add("btn-primary");
            stream.getTracks().forEach(t => t.stop());
            await uploadAudio(blob, filename);
          };
          mediaRecorder.start();
          recordBtn.textContent = "⏹ Stop recording";
          recordBtn.classList.remove("btn-primary");
          recordBtn.classList.add("btn-danger");
        }).catch(err => alert("Microphone access needed: " + err.message));
      }

      const recordBtn = document.getElementById("record-btn");
      if (recordBtn) recordBtn.addEventListener("click", handleRecord);
    });

    document.getElementById("signout-btn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "/";
    });
  </script>
</body>
</html>
